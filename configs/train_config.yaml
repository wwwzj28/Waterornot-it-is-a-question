model:
  name: resnet50
  num_classes: 4
  pretrained: true

data:
  root: ./data/resnet_cls
  image_size: 224
  batch_size: 16

train:
  epochs: 50
  learning_rate: 0.0001
  optimizer: adamw
  weight_decay: 0.0001
  patience: 10

classes:
  - empty
  - low
  - medium
  - high
